app = 'easybits'
primary_region = 'dfw'

# Grace window on deploy/restart: SIGTERM → wait up to this before SIGKILL. The
# WhatsApp pool surface uses it to DRAIN — let in-flight agent turns finish so a
# deploy doesn't cut a reply mid-stream (Fly's default is only 5s). See the drain
# handler in app/.server/integrations/whatsapp/baileys.server.ts.
kill_timeout = '30s'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    # El deploy espera a que este chequeo pase, así que su cadencia ES el tiempo
    # de despliegue: con 15s de gracia + hasta 30s al primer intento, se iban
    # ~45s de los 61s que tardaba. Con 8s/10s el peor caso baja a ~18s.
    # No se sube a `--strategy immediate` a propósito: hay UNA sola máquina, así
    # que el rollout no evita el corte — lo que compra la espera es DETECCIÓN.
    # Sin ella, una imagen que no arranca deja el CI en verde y el sitio caído.
    interval = "10s"
    grace_period = "8s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'
