<style>
:root{--grass:#96B894;--ink:#0a0a0a;--paper:#fff;--purple:#9870ED;--yellow:#ECD66E;--pink:#FFAFA3;--blue:#BFDBFE;--mute:#3d4a3c}
*{box-sizing:border-box}html,body{height:100%}
body{background:var(--grass);color:var(--ink);font-family:Cabin,system-ui,sans-serif;margin:0;overflow:hidden;display:grid;grid-template-rows:56px 1fr auto;touch-action:none}
.top{display:flex;align-items:center;gap:14px;background:var(--ink);color:#fff;padding:0 14px;border-bottom:2px solid #000}
.brand{display:flex;align-items:center;gap:8px;font-family:"Jersey 10",serif;font-size:28px}.brand img{width:36px}
.top h1{font-family:Outfit;font-weight:900;font-size:18px;margin:0 auto 0 4px;white-space:nowrap}
.level{display:flex;gap:4px;font-family:"Jersey 10",serif;font-size:19px}
.level span{padding:0 9px;border:2px solid #000;border-radius:999px;background:#fff;color:#000;opacity:.4;cursor:pointer;line-height:1.35}
.level span.on{opacity:1;background:var(--yellow);box-shadow:2px 2px 0 #000}.level .tera.on{background:var(--pink)}.level .byte.on{background:var(--blue)}
.score{font-family:"Jersey 10",serif;font-size:34px;line-height:1;color:var(--yellow);font-variant-numeric:tabular-nums;white-space:nowrap}.score small{font-family:Cabin;font-size:11px;color:#fff9;letter-spacing:.1em;text-transform:uppercase;margin-left:6px}
.btn{background:var(--purple);color:#000;font-family:Outfit;font-weight:700;font-size:14px;padding:8px 14px;border:2px solid #000;border-radius:10px;box-shadow:3px 3px 0 #000;text-decoration:none;white-space:nowrap}
@media(max-width:700px){.top h1,.score small,.btn{display:none}}
/* arena */
.arena{position:relative;background:var(--paper);border:3px solid #000;border-radius:22px;box-shadow:6px 6px 0 #000;overflow:hidden;margin:12px 12px 0;min-height:0}
.arena.over{background:#FFF9D6}
.hint{position:absolute;left:14px;top:12px;font-size:12px;color:var(--mute);z-index:3;max-width:46%}
.bot{position:absolute;left:38%;top:50%;transform:translate(-50%,-50%);width:min(58vh,380px,70vw);aspect-ratio:1/1.15}
@media(max-width:700px){.bot{left:50%}}
.head{position:absolute;left:50%;top:0;transform:translateX(-50%);width:62%;animation:bob 3.4s ease-in-out infinite}
.torso{position:absolute;left:50%;top:44%;transform:translateX(-50%);width:46%;height:40%;border:3px solid #000;border-radius:26px;background:var(--purple);box-shadow:5px 5px 0 #000}
.torso:after{content:"";position:absolute;inset:14% 18%;border:2px dashed #0006;border-radius:16px}
.leg{position:absolute;top:84%;width:15%;height:16%;border:3px solid #000;border-radius:12px;background:#fff;box-shadow:4px 4px 0 #000}.leg.l{left:30%}.leg.r{right:30%}
@keyframes bob{0%,100%{transform:translateX(-50%)}50%{transform:translate(-50%,-6px)}}
@media(prefers-reduced-motion:reduce){.head{animation:none}}
.slot{position:absolute;width:19%;aspect-ratio:1;border:2px dashed #0004;border-radius:18px;display:grid;place-items:center;transition:.15s}
.slot.hot{border-color:var(--purple);background:#9870ED22;transform:scale(1.08)}
.gear{position:absolute;inset:0;border:2px solid #000;border-radius:18px;background:#fff;box-shadow:4px 4px 0 #000;display:grid;place-items:center;animation:pop .45s cubic-bezier(.2,1.6,.4,1) both;cursor:pointer}
.gear img{width:64%}.gear b{position:absolute;right:-8px;top:-8px;background:var(--purple);color:#fff;border:2px solid #000;border-radius:999px;min-width:24px;height:24px;display:grid;place-items:center;font-family:"Jersey 10",serif;font-size:16px}
.gear:hover{background:#FFE9E4}
@keyframes pop{from{transform:scale(.3) rotate(-14deg);opacity:0}to{transform:scale(1);opacity:1}}
.flash{position:absolute;left:38%;top:12%;transform:translateX(-50%);font-family:"Jersey 10",serif;font-size:40px;color:var(--purple);opacity:0;pointer-events:none;z-index:4;white-space:nowrap}
.flash.go{animation:up 1.1s ease-out}@keyframes up{0%{opacity:0;transform:translate(-50%,10px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
.drag{position:fixed;z-index:50;pointer-events:none;width:64px;height:64px;border:2px solid #000;border-radius:16px;background:#fff;box-shadow:4px 4px 0 #000;display:grid;place-items:center;transform:translate(-50%,-50%) rotate(-6deg)}.drag img{width:40px}
/* ficha compacta, dentro de la arena */
.sheet{position:absolute;right:14px;top:14px;bottom:14px;width:min(270px,40%);background:var(--ink);color:#fff;border:2px solid #000;border-radius:16px;box-shadow:4px 4px 0 #000;padding:12px 14px;display:flex;flex-direction:column;min-height:0;z-index:3}
@media(max-width:700px){.sheet{display:none}}
.sheet h2{font-family:"Jersey 10",serif;font-weight:400;font-size:20px;margin:0;color:var(--yellow)}
.lines{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px;font-size:12px;overflow:auto;min-height:0}
.lines li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #fff2;padding-bottom:4px}
.lines em{display:block;font-style:normal;font-size:10px;color:#fff8;font-family:ui-monospace,Menlo,monospace}.lines b{font-family:ui-monospace,Menlo,monospace;font-weight:500}
.tot{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid #fff3;margin-top:auto;padding-top:8px;font-family:"Jersey 10",serif;font-size:26px;color:var(--yellow)}.tot small{font-family:Cabin;font-size:11px;color:#fff8}
.note{font-size:10.5px;color:#fffa;margin:6px 0 0}
.alt{color:#fffc;font-size:11px;text-decoration:underline;text-underline-offset:3px;margin-top:6px}
/* inventario: barra inferior */
.inv{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;padding:10px 12px 12px}
@media(max-width:900px){.inv{grid-template-columns:repeat(4,1fr)}}
.piece{background:var(--paper);border:2px solid #000;border-radius:12px;padding:8px 6px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:3px 3px 0 #000;cursor:grab;user-select:none;position:relative;text-align:center;min-width:0}
.piece:active{cursor:grabbing}.piece.on{background:var(--yellow)}
.piece img{width:30px;pointer-events:none}.piece .t{font-family:Outfit;font-weight:700;font-size:11.5px;line-height:1.05}.piece .d{font-size:10px;color:var(--mute);line-height:1.1}
.piece .n{position:absolute;right:-6px;top:-6px;background:var(--purple);color:#fff;border:2px solid #000;border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;font-family:"Jersey 10",serif;font-size:14px}
.level span:focus-visible,.btn:focus-visible,.piece:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
</style>
</head>

const BOX=299,WEB_FREE=50;
const WEB=[{u:400,p:99},{u:10000,p:999}],CR=[{u:500,p:39},{u:1000,p:69},{u:5000,p:299},{u:10000,p:549}],TOK=[{u:5e6,p:279},{u:10e6,p:549},{u:50e6,p:2749},{u:100e6,p:5499}];
// slot = posición en el robot (x%,y% del contenedor .bot): antena arriba, mochila atrás, brazos, pecho, pies, teléfono
const ITEMS=[
 {k:'web',icon:'cloud',t:'Antena web',d:'+500 consultas/mes',step:500,slot:[40,-4]},
 {k:'gb',icon:'template',t:'Mochila de archivos',d:'+10 GB',step:10,slot:[6,46]},
 {k:'docs',icon:'book',t:'Brazo documentos',d:'+20 docs/mes',step:20,slot:[16,66]},
 {k:'voice',icon:'micro',t:'Brazo de voz',d:'+5 min/mes',step:5,slot:[64,66]},

 {k:'agents',icon:'code',t:'Caja de agentes',d:'+4 agentes a la vez',step:4,slot:[74,42]},
 {k:'app',icon:'rocket',t:'Pies: app hospedada',d:'estandar · 2 vCPU · 2 GB',step:1,slot:[40,86]},
 {k:'wa',icon:'support',t:'WhatsApp',d:'su propio número',step:1,max:1,slot:[74,18]},
];
const q={agents:1,web:0,docs:0,voice:0,tok:0,app:0,gb:0,wa:0};
let plan='Byte',manual=false,lastPlan='Byte';
const fmtU=u=>u>=1e6?(u/1e6)+'M':u.toLocaleString('es-MX'),mx=n=>'$'+Math.round(n).toLocaleString('es-MX');
function packs(x,list){if(x<=0)return{n:0,txt:''};const by=[...list].sort((a,b)=>a.p/a.u-b.p/b.u);let left=x,picks=[],mxn=0;for(const p of by){const n=Math.floor(left/p.u);if(n){picks.push([p,n]);left-=n*p.u;mxn+=n*p.p}}if(left>0){const c=list.filter(p=>p.u>=left).sort((a,b)=>a.p-b.p)[0]||by[0];const n=c.u>=left?1:Math.ceil(left/c.u);picks.push([c,n]);mxn+=n*c.p}const s=list.filter(p=>p.u>=x).sort((a,b)=>a.p-b.p)[0];if(s&&s.p<mxn)return{n:s.p,txt:'1 × pack '+fmtU(s.u)};return{n:mxn,txt:picks.map(([p,n])=>n+' × pack '+fmtU(p.u)).join(' + ')}}
function suggest(){const cr=q.docs*100+q.voice*800;const byCr=cr<=999?'Byte':cr<=10000?'Mega':'Tera';const o=['Byte','Mega','Tera'];return o.find(k=>PLANS[k].gb>=q.gb&&o.indexOf(k)>=o.indexOf(byCr))||'Tera'}
function calc(){const P=PLANS[plan],L=[];L.push(['Plan '+plan,P.price?`${P.boxes} cajas · ${P.gb} GB · ${P.cr.toLocaleString('es-MX')} cr`:'gratis · 1 caja · 50 consultas',P.price]);

 const notes=[];if(q.gb>P.gb)notes.push(`Para ${q.gb} GB necesitas un plan mayor (${plan} incluye ${P.gb} GB).`);if(q.wa)notes.push('WhatsApp usa la caja del agente: sin costo extra.');

 const inv=document.getElementById('inv');inv.querySelectorAll('.piece').forEach(e=>e.remove());

function add(k,d){const i=ITEMS.find(x=>x.k===k);const min=k==='agents'?1:0,max=i.max?i.max*i.step:Infinity;q[k]=Math.min(max,Math.max(min,q[k]+i.step*d));render()}
// drag: pointer events sobre .piece → clon que sigue el puntero → soltar sobre la arena
let drag=null;const arena=document.getElementById('arena');
document.addEventListener('pointerdown',e=>{const p=e.target.closest('.piece');if(!p)return;const i=ITEMS.find(x=>x.k===p.dataset.k);const g=document.createElement('div');g.className='drag';g.innerHTML=`<img src="${ICON[i.icon]}" alt="">`;document.body.appendChild(g);drag={k:i.k,el:g};move(e);e.preventDefault()});
function move(e){if(!drag)return;drag.el.style.left=e.clientX+'px';drag.el.style.top=e.clientY+'px';const r=arena.getBoundingClientRect();const over=e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom;arena.classList.toggle('over',over);document.querySelectorAll('.slot').forEach(s=>s.classList.toggle('hot',over&&s.dataset.k===drag.k))}
document.addEventListener('pointermove',move);
document.addEventListener('pointerup',e=>{if(!drag)return;const r=arena.getBoundingClientRect();const over=e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom;if(over)add(drag.k,1);drag.el.remove();drag=null;arena.classList.remove('over');document.querySelectorAll('.slot').forEach(s=>s.classList.remove('hot'))});
document.addEventListener('click',e=>{const g=e.target.closest('.gear');if(g){add(g.dataset.k,-1);return}const l=e.target.closest('#level span');if(l){plan=l.dataset.plan;manual=true;render()}});
document.addEventListener('keydown',e=>{const p=e.target.closest?.('.piece');if(!p)return;if(e.key==='Enter'||e.key==='+')add(p.dataset.k,1);if(e.key==='-'||e.key==='Backspace')add(p.dataset.k,-1)});
render();
