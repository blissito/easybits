# Actualizaciones de dependencias. Agrupadas y semanales para no llenar de PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react-router:
        patterns: ["@react-router/*", "react-router", "react-router-dom"]
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "/cli"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cli-minor-and-patch:
        update-types: [minor, patch]
      # tsup va en grupo aparte: sus majores cambian el Node mínimo y se revisan juntos.
      cli-tsup:
        patterns: ["tsup"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
