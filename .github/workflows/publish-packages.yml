name: Publish Packages

on:
  push:
    tags:
      - 'packages-v*'
  # Permite probar la credencial sin inventar un tag ni quemar una versión:
  # con dry_run=true solo corre el chequeo de auth y termina.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Ensayo: no publica nada"
        type: boolean
        default: true

# Sin tokens (28-nov-2026: todos los NPM_TOKEN caducaron): npm Trusted Publishing (OIDC).
# npm confía en ESTE workflow: npmjs.com → cada paquete (@easybits.cloud/sdk, mcp, cli,
# eve-sandbox) → Settings → Trusted Publisher: GitHub Actions, blissito/easybits,
# publish-packages.yml. Mismo patrón que @ghostystudio/pointer en ghosty-studio.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing exige npm >= 11.5.1.
      - name: npm reciente
        run: npm install -g npm@11

      - name: Fin del ensayo
        if: inputs.dry_run
        run: |
          echo "dry_run activo — no se publicó nada."

      # Publica cada paquete SOLO si su versión aún no está en npm. Así un re-run
      # (versión sin cambios) salta limpio, pero un error REAL de publish — auth
      # (token muerto → npm devuelve 404), red o build — hace FALLAR el job en vez
      # de mentir "verde". `npm view` es lectura pública: funciona aunque el token
      # esté muerto, así que el skip por-versión es fiable.
      - name: Publish SDK
        if: ${{ !inputs.dry_run }}
        working-directory: packages/sdk
        run: |
          npm ci
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION ya está publicado — se salta."
          else
            npm publish
          fi

      - name: Publish MCP
        if: ${{ !inputs.dry_run }}
        working-directory: packages/mcp
        run: |
          npm ci
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION ya está publicado — se salta."
          else
            npm publish
          fi

      # Node 24: eve lo exige en `engines` y npm lo respeta al instalar devDependencies.
      - name: Publish eve-sandbox
        if: ${{ !inputs.dry_run }}
        working-directory: packages/eve-sandbox
        run: |
          npm ci --engine-strict=false
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION ya está publicado — se salta."
          else
            npm publish
          fi

      - name: Publish CLI
        if: ${{ !inputs.dry_run }}
        working-directory: cli
        run: |
          npm ci
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION ya está publicado — se salta."
          else
            npm publish
          fi
