# Producción vive en sandbox-host (fierro A, caja app-host) desde 2026-10-08: este workflow sólo
# publica la imagen en GHCR; la caja la jala sola (app-deploy.timer, ≤60 s) con salud y rollback.
#
# Tres jobs: `verify` y `build` corren EN PARALELO; `release` (needs: ambos) mueve el tag
# `:main` —el único que mira la caja— a la imagen de este commit. Así Verify es un CANDADO
# sin alargar el deploy: un rojo deja prod en el commit anterior y se ve en Actions.

name: Deploy
on:
  push:
    branches:
      - main
  # Redesplegar la última imagen sin tener que inventar un commit (útil para
  # recuperar de un deploy a medias o para medir el pipeline).
  workflow_dispatch:
jobs:
  # Typecheck, vitest, bloques generados, skills. Antes NO bloqueaba el deploy y estuvo en
  # rojo nueve commits seguidos (2026-10-14) sin que nadie lo viera: un check que no detiene
  # nada se ignora. Ahora es requisito de `release`.
  verify:
    name: Verify (typecheck, tests, docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Los `./+types/*` de React Router se generan; sin esto typecheck falla en limpio.
      - run: npx react-router typegen
      - run: npm run typecheck
      - run: npm run check:docs
      - run: npm run check:skills
      - run: npx vitest run
        env:
          CI: "true"

  build:
    name: Build image
    runs-on: ubuntu-latest
    # packages:write → la imagen va a GHCR, de donde la jala la caja de sandbox-host.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Warn if packages changed without version bump
        run: |
          if git diff HEAD~1 --name-only | grep -qE '^(packages/|cli/)'; then
            if ! git diff HEAD~1 --name-only | grep -qE '(packages/.*/package\.json|cli/package\.json)'; then
              echo "::warning::Changes in packages/ or cli/ detected without a package.json version bump. Did you forget to publish?"
            fi
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Sólo el tag del SHA: `:main` lo mueve `release` cuando verify pasa.
          tags: |
            ghcr.io/blissito/easybits:${{ github.sha }}
          # CACHEBUST = SHA del commit → fuerza recompilar la fuente en cada push
          # (las deps siguen cacheadas). Sin esto el gha cache a veces servía un
          # binario viejo y tools nuevas (ej. call_create) "desaparecían".
          build-args: |
            CACHEBUST=${{ github.sha }}
            GIT_SHA=${{ github.sha }}
          # El cache se queda en GitHub Actions. Se probó moverlo al registry de
          # Fly esperando ahorrar los ~34s de restaurar capas, y MIDIÓ PEOR y con
          # mucha más varianza: 129s con gha contra 132/140/178/205s con registry
          # — subir las capas de cache a Fly en cada build cuesta más de lo que
          # ahorra al bajarlas. Si alguien lo vuelve a intentar, que mida el
          # estado estacionario con un SHA NUEVO: un `workflow_dispatch` repite
          # el SHA, no invalida CACHEBUST y da un 110s engañoso.
          cache-from: type=gha
          # mode=max, NO min: este Dockerfile es multi-etapa y las capas caras
          # (npm ci, prisma generate) viven en `builder`, que no forma parte de
          # la imagen final. Con `min` no se cachearían y `npm ci` correría
          # entero en cada deploy — cambiar 33s de export por varios minutos.
          cache-to: type=gha,mode=max

  release:
    name: Release (verify ✓ → :main)
    needs: [verify, build]
    runs-on: ubuntu-latest
    concurrency: deploy-group
    permissions:
      contents: read
      packages: write
    steps:
      # Un release viejo que termina DESPUÉS de uno nuevo regresaría prod a un commit
      # anterior: sólo se publica si este SHA es MÁS NUEVO que el que sirve prod.
      # Antes se exigía ser la punta de main, y con pushes cada ~2 min (más rápido que lo
      # que tarda un deploy) ningún run llegaba a serlo: prod se quedó congelado el
      # 2026-10-17 aunque cada run salía verde. Los releases corren en serie
      # (deploy-group) y cada uno espera a que prod reporte su SHA, así que la comparación
      # siempre es contra lo que de verdad está publicado.
      - name: Skip if prod is already newer
        id: tip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ "${{ github.event_name }}" = "push" ] || exit 0
          prod=$(curl -fsS -m 10 https://www.easybits.cloud/api/version 2>/dev/null || true)
          if ! echo "$prod" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::notice::prod no reporta un SHA ('${prod:0:40}'); publico ${GITHUB_SHA:0:8}"
            exit 0
          fi
          [ "$prod" = "${{ github.sha }}" ] && { echo "stale=1" >> "$GITHUB_OUTPUT"; exit 0; }
          # ahead = este commit desciende del de prod (más nuevo) → publicar.
          status=$(curl -fsS -m 10 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/compare/$prod...${{ github.sha }}" | jq -r .status)
          if [ "$status" != "ahead" ]; then
            echo "::notice::prod va en ${prod:0:8} ($status respecto a ${GITHUB_SHA:0:8}); no publico"
            echo "stale=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.tip.outputs.stale != '1'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.tip.outputs.stale != '1'
        uses: docker/setup-buildx-action@v3

      # Retag sin reconstruir: segundos.
      - name: Point :main at this commit
        if: steps.tip.outputs.stale != '1'
        run: |
          docker buildx imagetools create \
            -t ghcr.io/blissito/easybits:main \
            ghcr.io/blissito/easybits:${{ github.sha }}

      # La caja confirma el rollout: /api/version devuelve el SHA del build.
      - name: Wait for rollout
        if: steps.tip.outputs.stale != '1'
        run: |
          for i in $(seq 1 50); do
            v=$(curl -fsS -m 5 https://www.easybits.cloud/api/version 2>/dev/null || true)
            [ "$v" = "${{ github.sha }}" ] && { echo "prod en ${{ github.sha }}"; exit 0; }
            sleep 6
          done
          echo "::error::prod no reporta ${{ github.sha }} (revisa journalctl -u app-deploy en la caja)"; exit 1
