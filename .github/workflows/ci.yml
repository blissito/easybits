# CI de easybits. Bloquean: `verify`, `cli`, `security` y `docker` (en PR).
# Lo que NO bloquea lleva `continue-on-error` y su motivo aquí mismo; ver docs/agents/ci.md.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    name: verify (app)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # Los ./+types/* de React Router se generan; sin esto typecheck falla en limpio.
      - run: npx react-router typegen
      - run: npm run typecheck
      # `npm test` es vitest en modo watch: en CI va la pasada única.
      - run: npm run test:run
        env:
          CI: "true"
      # NO bloquea: eslint no está en devDependencies y el script sale 127 en main.
      - id: lint
        run: npm run lint
        continue-on-error: true
      - name: Aviso si lint falló
        if: steps.lint.outcome == 'failure'
        run: echo "::warning::npm run lint falló (no bloquea). Ver el paso lint."
      # NO bloquea: en la caja de pruebas (3.9 GB de RAM) el build no terminó con 2 GB ni con 3 GB de heap. En CI corre con 4 GB.
      # Como el paso no bloquea, el job sale verde aunque falle: por eso el aviso de abajo.
      - id: build
        run: npm run build
        continue-on-error: true
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Aviso si el build falló
        if: steps.build.outcome == 'failure'
        run: echo "::warning::npm run build falló (no bloquea). Ver el paso build."
  cli:
    name: cli (tests y typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # El CLI pide node >=22 (cli/package.json). No copiar el 20 de publish-packages.yml.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
  security:
    if: github.event_name == 'pull_request'
    # Siempre en GitHub: gitleaks-action asume /home/runner y en la caja truena (13-oct).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # NO bloquea: el repo no tiene el grafo de dependencias activo y la acción sale en rojo
      # («Dependency review is not supported on this repository»). Activarlo en Settings → Code security → Dependency graph
      # y luego quitar continue-on-error. gitleaks sí bloquea.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        continue-on-error: true
        with:
          fail-on-severity: high
  docker:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Sólo comprueba que la imagen se construye; nunca la sube.
      - run: docker build -t ci-check .
