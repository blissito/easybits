# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main
  # Redesplegar la última imagen sin tener que inventar un commit (útil para
  # recuperar de un deploy a medias o para medir el pipeline).
  workflow_dispatch:
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Warn if packages changed without version bump
        run: |
          if git diff HEAD~1 --name-only | grep -qE '^(packages/|cli/)'; then
            if ! git diff HEAD~1 --name-only | grep -qE '(packages/.*/package\.json|cli/package\.json)'; then
              echo "::warning::Changes in packages/ or cli/ detected without a package.json version bump. Did you forget to publish?"
            fi
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Empujamos la imagen DIRECTO al registry de Fly en vez de cargarla en el
      # docker local y dejar que `flyctl --local-only` la suba entera. Medido en
      # el pipeline anterior: exportar a formato docker 69s + importar al docker
      # local 33s + subida de flyctl 116s = ~3.5 min moviendo bits que buildx ya
      # tenía en la mano. Empujando desde buildx sólo viajan las capas que
      # cambiaron, y las que no ya están en el registry.
      - name: Log in to Fly registry
        run: flyctl auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: registry.fly.io/easybits:${{ github.sha }}
          # CACHEBUST = SHA del commit → fuerza recompilar la fuente en cada push
          # (las deps siguen cacheadas). Sin esto el gha cache a veces servía un
          # binario viejo y tools nuevas (ej. call_create) "desaparecían".
          build-args: |
            CACHEBUST=${{ github.sha }}
          # El cache se queda en GitHub Actions. Se probó moverlo al registry de
          # Fly esperando ahorrar los ~34s de restaurar capas, y MIDIÓ PEOR y con
          # mucha más varianza: 129s con gha contra 132/140/178/205s con registry
          # — subir las capas de cache a Fly en cada build cuesta más de lo que
          # ahorra al bajarlas. Si alguien lo vuelve a intentar, que mida el
          # estado estacionario con un SHA NUEVO: un `workflow_dispatch` repite
          # el SHA, no invalida CACHEBUST y da un 110s engañoso.
          cache-from: type=gha
          # mode=max, NO min: este Dockerfile es multi-etapa y las capas caras
          # (npm ci, prisma generate) viven en `builder`, que no forma parte de
          # la imagen final. Con `min` no se cachearían y `npm ci` correría
          # entero en cada deploy — cambiar 33s de export por varios minutos.
          cache-to: type=gha,mode=max

      - name: Deploy
        run: flyctl deploy --image registry.fly.io/easybits:${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
