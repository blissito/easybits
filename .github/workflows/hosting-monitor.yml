name: Hosting monitor
# El horario lo lleva eb-cron (Restate, sandbox-host) desde 2026-10-18: el `schedule:` de
# GitHub se saltaba corridas (hasta 2 h sin correr) y con los dos activos los correos de
# alerta salían dobles. Queda sólo el disparo a mano.
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe sold domains, restart what is down, alert
        run: |
          curl -fsS --max-time 280 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "X-Cron-Trigger: github" \
            https://easybits.cloud/api/cron/check-hosting
