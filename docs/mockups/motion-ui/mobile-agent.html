<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EasyBits Motion — el agente edita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lib/kinetic-headline.css">
<style>
  /* ---- Tokens de marca EasyBits ---- */
  :root{
    --bg:#0b0b0f; --surface:#15151c; --surface-2:#1c1c25; --border:#2a2a36; --key:#2a2a36; --key-dark:#1c1c25;
    --purple:#7c3aed; --amber:#fbbf24; --text:#f2f2f5; --muted:#8a8a99;
    --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
    --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    --back:cubic-bezier(.34,1.56,.64,1);
    --accent:#7c3aed; --accent-2:#fbbf24; --ok:#f2f2f5; --warn:#fbbf24; --danger:#7c3aed;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.4;overflow:hidden;-webkit-font-smoothing:antialiased}
  .app{height:812px;max-height:100vh;display:flex;flex-direction:column;position:relative}

  /* ---- Barra de estado del teléfono ---- */
  .status{flex:none;height:44px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 24px 6px;font-weight:600;font-size:15px}
  .status .right{display:flex;gap:6px;align-items:center}
  .status svg{display:block}

  /* ---- Cabecera de la app ---- */
  .topbar{flex:none;display:flex;align-items:center;gap:10px;padding:6px 16px 10px;border-bottom:1px solid var(--border)}
  .brand{display:flex;align-items:center;gap:8px;flex:none}
  .brand .eyes{width:34px;height:20px;display:block}
  .brand .prod{font-weight:800;font-size:15px;letter-spacing:-.01em}
  .brand .prod b{color:var(--purple)}
  .spacer{flex:1}
  .agent-pill{flex:none;display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:5px 10px;border:1px solid var(--border);border-radius:999px;background:var(--surface)}
  .agent-pill i{width:7px;height:7px;border-radius:50%;background:#34d399}
  .agent-pill small{color:var(--muted);font-weight:500}

  /* ---- Escenas ---- */
  .scenes{flex:none;display:flex;gap:6px;padding:10px 16px 8px}
  .scenes span{flex:1;text-align:center;font-family:var(--mono);font-size:10px;padding:5px 0;border:1px solid var(--border);border-radius:6px;color:var(--muted);background:var(--surface);transition:all .3s var(--back)}
  .scenes span.on{background:var(--purple);border-color:var(--purple);color:#fff;transform:scale(1.06)}
  .scenes span.done{border-color:var(--amber);color:var(--amber)}

  /* ---- Preview 9:16 (se encoge cuando sube el teclado) ---- */
  .preview{flex:none;height:372px;display:grid;place-items:center;padding:0 16px;transition:height .35s var(--back)}
  .kb .preview{height:250px}
  .stage{height:100%;aspect-ratio:9/16;max-width:100%;background:var(--surface);border:1px solid var(--border);border-radius:16px;position:relative;overflow:hidden;container-type:inline-size}
  .dots{position:absolute;inset:-40px;background-image:radial-gradient(#3a3a4a 1.6px,transparent 1.7px);background-size:22px 22px;animation:breathe 3s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.08) translate(6px,6px);opacity:1}}
  .layer{position:absolute;inset:0}
  .layer.off{visibility:hidden}
  .badge{position:absolute;top:8%;left:8%;font-family:var(--mono);font-size:4.5cqw;color:var(--amber);border:1px solid var(--amber);border-radius:6px;padding:.3em .6em}
  .headline{position:absolute;left:8%;right:8%;top:28%;margin:0;font-size:13cqw;font-weight:900;line-height:1.02;letter-spacing:-.03em}
  .headline .caja{display:inline-block;transition:color .3s;position:relative}
  .headline .caja.amber{color:var(--amber);animation:bounce-in .9s var(--back)}
  .headline .caja.amber::after{content:"";position:absolute;inset:-6px -10px;border:3px solid var(--amber);border-radius:12px;animation:ring .9s ease-out forwards}
  @keyframes ring{from{transform:scale(.7);opacity:1}to{transform:scale(1.5);opacity:0}}
  @keyframes bounce-in{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  .sub{position:absolute;left:8%;width:58%;bottom:12%;color:var(--muted);font-size:5.2cqw}
  .ghosty{position:absolute;right:5%;bottom:6%;width:36cqw;transform:translateY(160%);opacity:0}
  .ghosty.in{animation:ghost-in 1.1s var(--back) forwards,hover 2.2s ease-in-out 1.2s infinite}
  @keyframes ghost-in{0%{transform:translateY(160%) scale(1.1,.8);opacity:1}55%{transform:translateY(-8%) scale(.9,1.15)}80%{transform:translateY(3%) scale(1.05,.95)}100%{transform:none;opacity:1}}
  @keyframes hover{50%{transform:translateY(-8px)}}
  .cta-big{position:absolute;left:8%;right:8%;top:26%;margin:0;font-size:13cqw;font-weight:900;line-height:1.05;letter-spacing:-.03em}
  .cta-big .k-unit:last-child{color:var(--amber)}
  .cta-btn{position:absolute;left:8%;top:52%;background:var(--amber);color:#0b0b0f;font-weight:800;padding:.8em 1.2em;border-radius:.7em;font-size:6cqw;transform:scale(0)}
  .cta .cta-btn{animation:pop-in .7s var(--back) .5s forwards,bounce 1.6s var(--back) 1.4s infinite}
  @keyframes bounce{0%,100%{transform:none}50%{transform:translateY(-6px) scale(1.04)}}
  .url{position:absolute;left:8%;top:66%;font-family:var(--mono);font-size:5.5cqw;min-height:1.3em}
  .logo-eb{position:absolute;right:8%;bottom:5%;height:4cqw;opacity:.7}
  .wipe{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column}
  .wipe i{flex:1;background:var(--purple);transform:translateX(-120%) skewX(-14deg)}
  .wipe i:nth-child(odd){background:var(--amber)}
  .wipe.go i{animation:slice .9s var(--back) forwards}
  .wipe.go i:nth-child(2){animation-delay:.05s}.wipe.go i:nth-child(3){animation-delay:.1s}
  .wipe.go i:nth-child(4){animation-delay:.15s}.wipe.go i:nth-child(5){animation-delay:.2s}
  .wipe.go i:nth-child(6){animation-delay:.25s}.wipe.go i:nth-child(7){animation-delay:.3s}
  @keyframes slice{0%{transform:translateX(-120%) skewX(-14deg)}45%,55%{transform:translateX(0) skewX(-14deg)}100%{transform:translateX(120%) skewX(-14deg)}}
  .render{position:absolute;left:8%;right:8%;bottom:8%;font-family:var(--mono);font-size:4.6cqw;color:var(--muted);display:none;flex-direction:column;gap:.5em}
  .render.on{display:flex}
  .render .meta{display:flex;justify-content:space-between}
  .render .bar{height:.7em;background:var(--bg);border:1px solid var(--border);border-radius:4px;overflow:hidden}
  .render .fill{height:100%;width:0;background:var(--purple);transition:width 2s linear}
  .render .done{color:#0b0b0f;background:var(--amber);padding:.7em;border-radius:6px;font-weight:700;text-align:center;transform:scale(0)}
  .render .done.show{animation:pop-in .6s var(--back) forwards}
  @keyframes pop-in{to{transform:scale(1)}}
  .fx{position:absolute;inset:0;pointer-events:none}

  /* ---- Chat ---- */
  .chat{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:6px 16px 0}
  .messages{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:8px;justify-content:flex-end}
  .msg{max-width:84%;padding:8px 11px;border-radius:14px;font-size:14px;line-height:1.35;animation:enter .5s var(--back);position:relative}
  @keyframes enter{from{opacity:0;transform:translateY(22px) scale(.9)}}
  .msg.user{align-self:flex-end;background:var(--purple);color:#fff;border-bottom-right-radius:4px}
  .msg.agent{align-self:flex-start;background:var(--surface-2);border:1px solid var(--border);border-bottom-left-radius:4px;font-family:var(--mono);font-size:12.5px;padding-left:34px}
  .msg.agent::before{content:"";position:absolute;left:9px;top:9px;width:18px;height:11px;background:url(lib/eyes-eb.svg) center/contain no-repeat}
  .msg time{display:block;font-size:10px;opacity:.55;margin-top:3px;text-align:right;font-family:var(--sans)}
  .typing{display:flex;gap:4px;padding:10px 12px 10px 34px}
  .typing b{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:dot 1s ease-in-out infinite}
  .typing b:nth-child(2){animation-delay:.15s}.typing b:nth-child(3){animation-delay:.3s}
  @keyframes dot{50%{transform:translateY(-4px);opacity:.5}}
  .input{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);border-radius:22px;padding:8px 8px 8px 14px;min-height:44px;margin-bottom:8px}
  .input span{flex:1;color:var(--text);font-size:15px;min-height:1.3em;display:flex;align-items:center}
  .input span:empty::before{content:"Mensaje";color:var(--muted)}
  .input .caret{width:2px;height:16px;background:var(--purple);animation:blink 1s steps(1) infinite;opacity:0;transition:opacity .2s}
  .kb .input .caret{opacity:1}
  @keyframes blink{50%{opacity:0}}
  .input .send{flex:none;width:30px;height:30px;border-radius:50%;background:var(--purple);display:grid;place-items:center;transition:transform .2s var(--back)}
  .send.hit{animation:hit .35s var(--back)}
  @keyframes hit{50%{transform:scale(1.3)}}

  /* ---- Teclado ---- */
  .keyboard{flex:none;height:0;overflow:hidden;background:var(--key-dark);transition:height .35s var(--back);padding:0 4px}
  .kb .keyboard{height:216px}
  .krow{display:flex;gap:5px;justify-content:center;margin-top:8px}
  .krow:first-child{margin-top:8px}
  .key{width:32px;height:40px;border-radius:5px;background:var(--key);display:grid;place-items:center;font-size:17px;font-weight:500;transition:background .06s,transform .06s}
  .key.wide{width:44px;font-size:12px;color:var(--muted)}
  .key.space{width:168px;font-size:12px;color:var(--muted)}
  .key.ret{width:80px;font-size:12px;background:var(--purple)}
  .key.down{background:var(--purple);transform:translateY(-2px) scale(1.08)}
  .home{flex:none;height:22px;display:grid;place-items:center}
  .home i{width:134px;height:5px;border-radius:3px;background:var(--text);opacity:.8}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="status">
    <span>9:41</span>
    <span class="right">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="#f2f2f5"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
      <svg width="16" height="11" viewBox="0 0 16 11" fill="none" stroke="#f2f2f5" stroke-width="1.6" stroke-linecap="round"><path d="M1 3.5a10 10 0 0 1 14 0"/><path d="M3.8 6.3a6 6 0 0 1 8.4 0"/><path d="M6.4 9a2.4 2.4 0 0 1 3.2 0"/></svg>
      <svg width="27" height="12" viewBox="0 0 27 12" fill="none"><rect x=".5" y=".5" width="22" height="11" rx="3" stroke="#f2f2f5" opacity=".5"/><rect x="2" y="2" width="19" height="8" rx="1.5" fill="#f2f2f5"/><rect x="24" y="4" width="2" height="4" rx="1" fill="#f2f2f5" opacity=".5"/></svg>
    </span>
  </div>
  <header class="topbar">
    <div class="brand"><img class="eyes" src="lib/eyes-eb.svg" alt="EasyBits"><span class="prod">Motion <b>Graphics</b></span></div>
    <span class="spacer"></span>
    <span class="agent-pill"><i></i>Claude Code <small>· en línea</small></span>
  </header>

  <div class="scenes" id="scenes"><span>Hook</span><span>Palabra</span><span>Ghosty</span><span>CTA</span></div>

  <section class="preview">
    <div class="stage">
      <div class="dots"></div>
      <div class="layer" id="hook">
        <span class="badge">SANDBOX v2</span>
        <h1 class="headline"><span id="kh" data-kinetic data-kinetic-anim="pop">Tu agente, en su propia</span> <span class="caja" id="caja">caja</span></h1>
        <p class="sub">Aislado, con su propio disco y sin tocar tu máquina.</p>
        <img class="ghosty" id="ghosty" src="ghosty.png" alt="Ghosty">
      </div>
      <div class="layer off" id="cta">
        <span class="badge">CTA</span>
        <h1 class="cta-big"><span id="kc" data-kinetic data-kinetic-anim="pop">Pruébalo hoy, gratis.</span></h1>
        <span class="cta-btn">Empieza gratis</span>
        <span class="url" id="url"></span>
        <div class="render" id="render">
          <div class="meta"><span>render · h264</span><span><b id="frames">0</b> / 360</span></div>
          <div class="bar"><div class="fill" id="fill"></div></div>
          <div class="done" id="done">MP4 listo · 12 s</div>
        </div>
      </div>
      <div class="wipe" id="wipe"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="fx" id="fx"></div>
      <img class="logo-eb" src="lib/wordmark-eb.svg" alt="EasyBits">
    </div>
  </section>

  <section class="chat">
    <div class="messages" id="messages"></div>
    <div class="input"><span id="draft"></span><i class="caret"></i><span class="send" id="send"><svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg></span></div>
  </section>
  <div class="keyboard" id="keyboard"></div>
  <div class="home"><i></i></div>
</div>

<script src="lib/kinetic-headline.js"></script>
<script src="lib/text-scramble.js"></script>
<script src="lib/_util.js"></script>
<script src="lib/confetti-cannon.js"></script>
<script>
  // Guion de 24 s en bucle: cada mensaje del usuario cambia el preview un segundo después.
  // Recetas de motion-anything: kinetic-headline (titulares), text-scramble (respuestas), confetti (export).
  // Cada evento se registra en window.__events con su tiempo para montar los SFX después con ffmpeg.
  const LOOP = 24000, TYPE_MS = 55;
  const $ = id => document.getElementById(id);
  const app = $('app'), messages = $('messages'), draft = $('draft'), send = $('send');
  const scenes = [...$('scenes').children];
  const SCRIPT = [
    { at: 2500,  scene: 1, user: "Pon 'caja' en ámbar y que rebote", agent: "Listo: caja → #fbbf24, back.out 0.9 s", fx: 'caja',   effect: () => $('caja').classList.add('amber') },
    { at: 8000,  scene: 2, user: "Mete a Ghosty desde abajo",         agent: "Ghosty entra con squash & stretch",     fx: 'ghosty', effect: () => $('ghosty').classList.add('in') },
    { at: 13300, scene: 3, user: "Cierra con CTA a easybits.cloud",   agent: "Escena 4: CTA · 12 s totales",          fx: 'wipe',   effect: () => wipeTo('cta') },
    { at: 18800, scene: 3, user: "Exporta",                           agent: "Render 1080×1920 · 360 frames",         fx: 'render', effect: () => renderMp4() },
  ];
  const timers = [];
  let T0 = 0, confetti = null;
  const later = (ms, fn) => timers.push(setTimeout(fn, ms));
  const now = () => performance.now() - T0;
  window.__events = [];
  const log = (kind, extra) => window.__events.push(Object.assign({ t: +(now() / 1000).toFixed(3), kind }, extra || {}));

  // teclado: filas y búsqueda de tecla por letra
  const ROWS = ['qwertyuiop', 'asdfghjklñ', 'zxcvbnm'];
  const kb = $('keyboard');
  ROWS.forEach((r, i) => {
    const row = document.createElement('div'); row.className = 'krow';
    if (i === 2) row.appendChild(mk('⇧', 'wide'));
    [...r].forEach(ch => row.appendChild(mk(ch)));
    if (i === 2) row.appendChild(mk('⌫', 'wide'));
    kb.appendChild(row);
  });
  const last = document.createElement('div'); last.className = 'krow';
  last.appendChild(mk('123', 'wide')); last.appendChild(mk('espacio', 'space')); last.appendChild(mk('enviar', 'ret'));
  kb.appendChild(last);
  function mk(label, cls){ const k = document.createElement('div'); k.className = 'key' + (cls ? ' ' + cls : ''); k.textContent = label; k.dataset.k = label; return k; }
  function press(ch){
    const key = ch === ' ' ? kb.querySelector('.space') : kb.querySelector('.key[data-k="' + ch.toLowerCase() + '"]');
    if (!key) return; key.classList.add('down'); setTimeout(() => key.classList.remove('down'), 90);
  }

  function typeDraft(text, cb){
    let i = 0; draft.textContent = '';
    const iv = setInterval(() => { const ch = text[i]; draft.textContent = text.slice(0, ++i); press(ch); log('key'); if (i >= text.length) { clearInterval(iv); cb(); } }, TYPE_MS);
  }
  function stamp(){ const d = new Date(); d.setHours(9, 41 + Math.floor(now() / 60000)); return d.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }); }
  function bubble(cls, text){ const m = document.createElement('div'); m.className = 'msg ' + cls; m.textContent = text; if (cls !== 'typing') { const t = document.createElement('time'); t.textContent = stamp(); m.appendChild(t); } messages.appendChild(m); return m; }
  function agentSays(text){ const m = bubble('agent', ''); const span = document.createElement('span'); m.prepend(span); scrambleTo(span, text); log('agent'); }
  function setScene(i){ scenes.forEach((s, j) => { s.classList.toggle('on', j === i); s.classList.toggle('done', j < i); }); }
  function kinetic(id){ const el = $(id); el.classList.remove('is-in'); void el.offsetWidth; requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('is-in'))); }
  function step(s){
    later(s.at - 450, () => { app.classList.add('kb'); log('kb-up'); });
    later(s.at, () => typeDraft(s.user, () => {
      later(250, () => {
        send.classList.add('hit'); later(350, () => send.classList.remove('hit'));
        bubble('user', s.user); draft.textContent = ''; log('send');
        app.classList.remove('kb'); log('kb-down');
        const ty = bubble('typing', ''); ty.innerHTML = '<b></b><b></b><b></b>'; ty.classList.add('typing');
        later(1100, () => { ty.remove(); agentSays(s.agent); setScene(s.scene); s.effect(); log(s.fx); });
      });
    }));
  }
  function wipeTo(id){
    const w = $('wipe'); w.classList.remove('go'); void w.offsetWidth; w.classList.add('go');
    later(450, () => { $('hook').classList.add('off'); $(id).classList.remove('off'); kinetic('kc'); scrambleTo($('url'), 'easybits.cloud'); log('cta-in'); });
  }
  function renderMp4(){
    const r = $('render'); r.classList.add('on');
    later(50, () => $('fill').style.width = '100%');
    const t0 = performance.now();
    (function tick(){ const p = Math.min(1, (performance.now() - t0) / 2000); $('frames').textContent = Math.round(p * 360); if (p < 1) requestAnimationFrame(tick); })();
    later(2100, () => { $('done').classList.add('show'); scenes.forEach(s => { s.classList.remove('on'); s.classList.add('done'); }); confetti = HPX['confetti-cannon']($('fx')); log('done'); });
    later(4400, () => { if (confetti) { confetti.stop(); confetti = null; } });
  }
  function reset(){
    timers.forEach(clearTimeout); timers.length = 0;
    if (confetti) { confetti.stop(); confetti = null; }
    messages.innerHTML = ''; draft.textContent = ''; app.classList.remove('kb');
    $('caja').classList.remove('amber'); $('ghosty').classList.remove('in');
    $('hook').classList.remove('off'); $('cta').classList.add('off');
    $('render').classList.remove('on'); $('fill').style.width = '0'; $('done').classList.remove('show'); $('frames').textContent = '0'; $('url').textContent = '';
    setScene(0);
  }
  function run(){
    reset(); T0 = performance.now();
    kinetic('kh'); log('title');
    later(700, () => agentSays('Escena 1 lista · dime qué cambiar'));
    SCRIPT.forEach(step);
    // cierre: la cortinilla tapa el corte y del otro lado ya está la escena 1 completa (nunca un frame vacío)
    later(LOOP - 900, () => { const w = $('wipe'); w.classList.remove('go'); void w.offsetWidth; w.classList.add('go'); log('wipe'); });
    later(LOOP - 450, () => { const ev = window.__events; run(); window.__events = ev; });
  }
  window.startLoop = run;
  if (!location.search.includes('manual')) run();
</script>
</body>
</html>
